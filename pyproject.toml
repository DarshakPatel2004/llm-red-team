[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-red-team"
version = "0.1.0"
description = "Enterprise LLM security testing framework"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LLM Red Team Suite"}]
dependencies = [
    "httpx>=0.25.0",
    "openai>=1.0.0",
    "anthropic>=0.18.0",
    "google-generativeai>=0.3.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "sqlalchemy>=2.0",
    "rich>=13.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.4.0",
    "locust>=2.0",
]
local = ["ollama>=0.2.0"]

[project.scripts]
llm-red-team = "llm_red_team.api.cli:main"

[tool.pytest.ini_options]
testpaths = ["llm_red_team/tests"]
addopts = ["-v", "--tb=short", "--cov=llm_red_team", "--cov-report=term-missing", "--disable-warnings"]
filterwarnings = ["ignore::ResourceWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true

[tool.black]
line-length = 120
target-version = ["py310"]
